name: Store production checks

on:
  push:
    branches: [store-production-build]
  pull_request:
    branches: [store-production-build]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check server/index.js
      - name: Check storefront client syntax
        run: node --check store-app.js
      - name: Ensure common secret formats are not committed
        run: |
          ! grep -RInE 'sb_(secret|publishable)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
