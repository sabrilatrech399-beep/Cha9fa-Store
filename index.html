<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cha9fa Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Cha9fa <span>Store</span></a>
    <div class="account" id="accountArea"></div>
  </header>

  <main>
    <section class="hero">
      <div>
        <div class="badge">متجر Cha9fa الرسمي</div>
        <h1>استبدل نقاطك<br><span>بجواهر فري فاير</span></h1>
        <p>النقاط تُحتسب من مشاهدة البث فقط. سجّل دخولك بحساب Kick لترى رصيدك وتستبدله مباشرة.</p>
        <a class="hero-btn" href="#products">عرض الباقات</a>
      </div>
      <div class="hero-diamond"><img src="images/diamond.png" alt="جوهرة"></div>
    </section>

    <section class="wallet" id="wallet">
      <div>
        <span class="muted">رصيد نقاطك</span>
        <strong id="points">—</strong>
      </div>
      <div class="wallet-note" id="walletNote">سجّل الدخول بحساب Kick لمعرفة رصيدك.</div>
    </section>

    <section class="section" id="products">
      <div class="section-title">
        <div>
          <span class="eyebrow">الباقات</span>
          <h2>اختر عدد الجواهر</h2>
        </div>
      </div>
      <div id="productsGrid" class="products-grid"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" aria-label="إغلاق">×</button>
      <span class="eyebrow">تأكيد الاستبدال</span>
      <h2 id="modalTitle">—</h2>
      <p class="modal-price" id="modalPrice">—</p>
      <form id="orderForm">
        <label>اسمك في اللعبة<input name="playerName" maxlength="100" required autocomplete="name"></label>
        <label>الدولة<input name="country" maxlength="80" required autocomplete="country-name"></label>
        <label>ID اللعبة<input name="gameId" maxlength="80" required inputmode="text"></label>
        <button class="submit" type="submit" id="submitOrder">تأكيد الاستبدال</button>
      </form>
      <p class="form-error" id="formError" hidden></p>
    </section>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
