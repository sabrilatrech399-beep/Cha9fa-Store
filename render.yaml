services:
  - type: web
    name: cha9fa-store
    runtime: node
    branch: store-production-build
    buildCommand: npm install --prefix server --no-audit --no-fund
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: KICK_REDIRECT_URI
        sync: false
      - key: KICK_CHANNEL_SLUG
        sync: false
      - key: ADMIN_KICK_USER_IDS
        sync: false
      - key: WATCH_INGEST_SECRET
        sync: false
      - key: WATCH_CHANNEL_USER_ID
        sync: false
      - key: WATCH_CHANNEL_SLUG
        sync: false
      - key: WATCH_POINTS_PER_MINUTE
        value: "0"
      - key: WATCH_MAX_MINUTES_PER_EVENT
        value: "10"
