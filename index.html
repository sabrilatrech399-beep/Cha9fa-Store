<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cha9fa Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">Cha9fa <span>Store</span></div>
    <button id="cartBtn" class="cart-btn">🛒 السلة <b id="cartCount">0</b></button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="badge">متجر Cha9fa</p>
        <h1>كل ما تحتاجه<br><span>في مكان واحد</span></h1>
        <p class="hero-text">متجر سريع وبسيط لعرض منتجاتك واستقبال الطلبات.</p>
        <a href="#products" class="primary">تصفح المنتجات</a>
      </div>
    </section>

    <section class="section" id="products">
      <div class="section-head">
        <h2>المنتجات</h2>
        <input id="search" type="search" placeholder="ابحث عن منتج...">
      </div>
      <div id="productsGrid" class="grid"></div>
    </section>
  </main>

  <div id="cartPanel" class="cart-panel">
    <div class="cart-head">
      <h2>سلة المشتريات</h2>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total">المجموع: <strong id="cartTotal">0 دج</strong></div>
    <button id="checkout" class="primary full">إتمام الطلب</button>
  </div>

  <div id="overlay" class="overlay"></div>
  <script src="script.js"></script>
</body>
</html>
